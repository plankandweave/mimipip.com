name: Upload Happy Petals print masters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 13aafd6aa6cfe9043868017f5a1c577f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Upload exact flat artwork under content-addressed master names
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto'),{execFileSync}=require('child_process');
          const masters=require('./src/brand/commerce/happy-petals-masters.json');
          for(const [slug,m] of Object.entries(masters)){
            const bytes=fs.readFileSync(m.source);
            if(crypto.createHash('sha256').update(bytes).digest('hex')!==m.sha256)throw Error('Hash mismatch '+slug);
            const key=new URL(m.url).pathname.slice(1);
            execFileSync('node',['node_modules/wrangler/bin/wrangler.js','r2','object','put','zyvorah-media/'+key,'--file',m.source,'--content-type','image/png','--remote'],{stdio:'inherit'});
          }
          JS
