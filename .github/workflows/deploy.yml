# The one deploy of mimipip.com: every push to main is tested, built and published to the
# Cloudflare Worker `mimipip-com`. Nothing deploys from a laptop or a chat session.
# Needs one repository secret, CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers").
name: Deploy mimipip.com
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-mimipip
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: 13aafd6aa6cfe9043868017f5a1c577f
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          node node_modules/esbuild/install.js
          node node_modules/workerd/install.js
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck:app
      - name: Build
        run: MIMIPIP_LOCAL_REVIEW=1 NEXT_PUBLIC_MIMIPIP_LOCAL_REVIEW=1 npx vinext build
      # D1 migrations are NOT run here: the deploy token is a Workers token with no D1 access
      # (code 7403, 11 Nov 2026). 0006 was applied once and recorded in d1_migrations; a new
      # table is created by the Worker itself (docs/CHECKOUT.md).
      - name: Stable gift-card signing key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Every issued code is derived from MIMIPIP_GIFT_SECRET, so it is created ONCE and never rotated here.
          # "could not read the list" must fail the deploy, never be mistaken for "absent".
          npx wrangler secret list --config dist/server/wrangler.json --format json > "$RUNNER_TEMP/mimipip-secret-names.json"
          state=$(node -e '
            const fs=require("fs"); const raw=fs.readFileSync(process.argv[1],"utf8");
            const a=raw.indexOf("["), z=raw.lastIndexOf("]"); let rows;
            try { rows=JSON.parse(raw.slice(a, z+1)); if(!Array.isArray(rows)) throw 0; } catch { console.log("unreadable"); process.exit(0); }
            console.log(rows.some(x=>x&&x.name==="MIMIPIP_GIFT_SECRET")?"present":"absent");
          ' "$RUNNER_TEMP/mimipip-secret-names.json")
          case "$state" in
            present) echo "MIMIPIP_GIFT_SECRET is set; kept." ;;
            absent) openssl rand -hex 32 | npx wrangler secret put MIMIPIP_GIFT_SECRET --config dist/server/wrangler.json ;;
            *) echo "::error::Could not read the Worker's secret list, so the gift signing key was left untouched and nothing was deployed."; cat "$RUNNER_TEMP/mimipip-secret-names.json"; exit 1 ;;
          esac
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::The repository secret CLOUDFLARE_API_TOKEN is not set, so nothing was deployed."; exit 1; }
          npx wrangler deploy --config dist/server/wrangler.json --message "main ${GITHUB_SHA::7}"
      - name: Check the live site
        run: |
          sleep 20
          # Payments are taken only on a live Razorpay key (src/brand/commerce/gateway-mode.ts).
          # Live: checkout and gift cards must be open. Not live: both must be CLOSED, so the
          # guard is proved holding, and the run says so loudly instead of passing quietly.
          gift=$(curl -fsS https://mimipip.com/api/gift-card/readiness); shop=$(curl -fsS https://mimipip.com/api/checkout/readiness)
          mode=$(node -e 'const a=JSON.parse(process.argv[1]),b=JSON.parse(process.argv[2]); if(a.gateway!==b.gateway){console.log("mismatch");process.exit(0)} console.log(a.gateway)' "$gift" "$shop")
          echo "Razorpay gateway mode: $mode"
          case "$mode" in
            live) { echo "$gift" | grep -q '"open":true' && echo "$shop" | grep -q '"open":true'; } || { echo "::error::Live key but checkout or gift cards are closed."; exit 1; } ;;
            test|unknown)
              { echo "$gift" | grep -q '"open":false' && echo "$shop" | grep -q '"open":false'; } || { echo "::error::Key is not live but checkout or gift cards are open: payments could be taken that are no money."; exit 1; }
              echo "::warning::Razorpay key is not live ($mode): mimipip.com checkout and gift cards are closed and take no payments until live keys are set on zyvorah-store." ;;
            *) echo "::error::Gift and checkout readiness disagree about the gateway mode."; exit 1 ;;
          esac
          test "$(curl -s -o /dev/null -w '%{http_code}' https://mimipip.com/api/gift-card/print)" = 404
          curl -fsS https://mimipip.com/feeds/google-merchant.xml | grep -q '<g:brand>MimiPip</g:brand>'
          curl -fsS https://mimipip.com/sitemap.xml | grep -q 'https://mimipip.com/hopscotch-floor-sticker'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://mimipip.com/products/sage-meadow)" = 302
      # ChatGPT, Claude, Perplexity, Google and Bing can read the shop: robots
      # invites them, llms.txt and the OpenAI feed are MimiPip's own, product
      # pages carry one Product with a real price (docs/ai-assistant-visibility.md).
      - name: Check assistants can read the shop
        run: node scripts/verify-ai-visibility.mjs
